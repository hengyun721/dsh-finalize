# Bundle patch applied by `install_bundle`.
# Inserts one plugin row; the config below is the documented default (see README).
# `author: ''` means: clear library names, write no person's name.
- insert:
    - id: dsh-finalize
      name: 'dsh-finalize'
      config:
        author: ''
        triggerTools:
          - present
          - qqbot_send_file
        formats:
          - docx
          - pptx
          - xlsx
          - pdf
          - odt
          - ods
          - odp
        scanLimit: 5
        autoFix:
          stripGeneratorFields: true
          dropApplicationField: true
          recomputeStats: true
        textCheck:
          punctuation: true
          languages:
            - zh
            - ja
            - en
            - fr
            - ko
            - de
        report:
          surface: panel
